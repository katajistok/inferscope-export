global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:

  # axon — runs as systemd service on the host
  # network_mode: host means localhost resolves correctly from the container
  - job_name: "axon"
    static_configs:
      - targets: ["localhost:9101"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "([^:]+)(?::\\d+)?"
        replacement: "$1"
